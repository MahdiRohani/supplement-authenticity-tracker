version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        rename:
          chainProductId: ChainProductID
          productId: ProductID
          entityId: EntityID
          metadataCid: MetadataCID
          batchId: BatchID
          segmentId: SegmentID
          fromSegmentId: FromSegmentID
          toSegmentId: ToSegmentID
          physicalBatchId: PhysicalBatchID
          chain_product_id: ChainProductID
          product_id: ProductID
          entity_id: EntityID
          metadata_cid: MetadataCID
          batch_id: BatchID
          segment_id: SegmentID
          from_segment_id: FromSegmentID
          to_segment_id: ToSegmentID
          physical_batch_id: PhysicalBatchID
        overrides:
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - db_type: pg_catalog.timestamp
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
