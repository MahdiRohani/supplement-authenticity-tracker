services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplement_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ipfs:
    image: ipfs/kubo:v0.32.1
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfsdata:/data/ipfs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supplement_tracker?schema=public
      RPC_URL: ${RPC_URL:-}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-}
      REGISTRY_ABI_PATH: /app/packages/abis/SupplementRegistry.json
      DEPLOYMENTS_PATH: /app/packages/abis/deployments.json
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080/ipfs
      ALLOW_IPFS_STUB: ${ALLOW_IPFS_STUB:-true}
      VERIFY_CACHE_TTL_MS: 15000
      VERIFY_RATE_LIMIT: 60
      CONSUME_RATE_LIMIT: 20
      RATE_LIMIT_WINDOW_MS: 60000
      RELAYER_KEYS_JSON: ${RELAYER_KEYS_JSON:-{"0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266":"0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80","0x70997970c51812dc3a010c7d01b50e0d17dc79c8":"0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d","0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc":"0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"}}
      FF_REPORTS: ${FF_REPORTS:-true}
      FF_SCAN: ${FF_SCAN:-true}
      FF_LABELS_PDF: ${FF_LABELS_PDF:-true}
      FF_ANALYTICS: ${FF_ANALYTICS:-true}
      FF_EIP712_METADATA: ${FF_EIP712_METADATA:-true}
      FF_META_TX_CONSUME: ${FF_META_TX_CONSUME:-true}
      FF_SUBGRAPH: ${FF_SUBGRAPH:-false}
      PORT: 3000
      NODE_ENV: development
    volumes:
      - ./packages/abis:/app/packages/abis:ro
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started

volumes:
  pgdata:
  ipfsdata:
